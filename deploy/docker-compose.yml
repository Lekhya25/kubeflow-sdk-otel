# Local observability stack for kubeflow-sdk-otel.
#
#   docker compose -f deploy/docker-compose.yml up -d
#
#   Grafana     http://localhost:3000   (dashboard: "Kubeflow SDK")
#   Jaeger      http://localhost:16686
#   Prometheus  http://localhost:9090
#   OTLP        localhost:4317 (gRPC), localhost:4318 (HTTP)

name: kubeflow-otel

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.128.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    depends_on:
      - jaeger
      - prometheus
    restart: unless-stopped

  jaeger:
    image: jaegertracing/jaeger:2.7.0
    ports:
      - "16686:16686" # UI and query API
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-otlp-receiver          # accept OTLP pushes at /api/v1/otlp
      - --enable-feature=exemplar-storage   # keep metric -> trace links
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped

  # Real training jobs through the Kubeflow SDK (opt-in):
  #   docker compose -f deploy/docker-compose.yml --profile demo run --rm demo
  demo:
    profiles: ["demo"]
    build:
      context: ..
      dockerfile: examples/demo/Dockerfile
    environment:
      KUBEFLOW_OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_METRIC_EXPORT_INTERVAL: "2000"
    depends_on:
      - otel-collector

  grafana:
    image: grafana/grafana:12.0.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/kubeflow-sdk.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - jaeger
    restart: unless-stopped
