name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src tests scripts examples
      - run: ruff format --check src tests scripts examples
      - name: Grafana dashboard matches its generator
        run: python scripts/build_dashboard.py --check

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest --cov=kubeflow_otel --cov-report=term-missing

  e2e:
    name: end-to-end (collector, Jaeger, Prometheus, Grafana)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: docker compose -f deploy/docker-compose.yml up -d --wait
      - run: python scripts/smoke_test.py --timeout 120
      - name: Grafana provisioned the dashboard
        run: curl -sf http://localhost:3000/api/dashboards/uid/kubeflow-sdk > /dev/null
      - if: failure()
        run: docker compose -f deploy/docker-compose.yml logs
      - if: always()
        run: docker compose -f deploy/docker-compose.yml down -v
